<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>カス高｜メインストーリー</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script src="./assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <header class="site-header"><a class="brand" href="./">カス高</a><span>メインストーリー</span></header>
  <main id="main" tabindex="-1">
    <section id="contents" aria-labelledby="contents-title">
      <div class="section-heading"><h1 id="contents-title">目次</h1><span id="chapter-count"></span></div>
      <ol id="chapter-list" class="chapter-list"></ol>
      <p id="status" class="empty" role="status">読み込み中…</p>
    </section>
    <section id="reader" aria-labelledby="chapter-title" hidden>
      <div class="reader-tools"><a href="#">目次へ</a><fieldset><legend class="visually-hidden">文字サイズ</legend><button type="button" id="font-small" aria-label="文字を小さく">A−</button><button type="button" id="font-large" aria-label="文字を大きく">A＋</button></fieldset></div>
      <div class="chapter-heading"><p id="chapter-label"></p><h1 id="chapter-title" tabindex="-1"></h1><p id="chapter-character-count" class="chapter-character-count" title="本文の文字数（空白・改行を除く）"></p></div>
      <article id="chapter-text" class="story"></article>
      <nav class="chapter-nav" aria-label="話の移動"><a id="previous">前の話</a><a href="#">目次</a><a id="next">次の話</a></nav>
    </section>
  </main>
  <footer>カス高</footer>
</body>
</html>
